# Builds the plugin from the Chartdown monorepo (the single source of truth)
# and cuts a release the Obsidian community store can consume: tag = exact
# manifest version (no v prefix), with main.js / manifest.json / styles.css
# as individual assets carrying build-provenance attestations, and the root
# manifest.json + versions.json + src/ synced (the store requires source in
# the repository).
name: Release plugin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Chartdown monorepo ref to build (branch, tag, or SHA)
        default: main

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Nossimonov/Chartdown
          ref: ${{ inputs.ref }}
          path: chartdown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: chartdown
      - run: npm run build
        working-directory: chartdown
      - run: npm test
        working-directory: chartdown
      - id: version
        run: echo "version=$(node -p "require('./chartdown/packages/obsidian/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Sync source, manifest.json, and versions.json from the monorepo
        run: |
          rm -rf src
          cp -r chartdown/packages/obsidian/src src
          # Test scaffolding stays behind. The shim fakes Obsidian's DOM helpers
          # under happy-dom, and the specs import vitest — neither is plugin
          # source, and the store requires the SOURCE of what ships. Shipping
          # them means the store's scan type-checks files whose dependencies the
          # plugin deliberately does not carry.
          rm -f src/obsidian-dom-shim.ts
          rm -f src/*.test.ts
          cp chartdown/packages/obsidian/styles.css styles.css
          cp chartdown/packages/obsidian/dist/manifest.json manifest.json
          cp chartdown/packages/obsidian/CHANGELOG.md CHANGELOG.md
          # The @chartdown pins here are what the community-store scan and any
          # local `tsc` resolve against — the SHIPPED plugin is bundled from the
          # monorepo workspace and never reads them. So they drift silently, and
          # the only symptom is a type error on an API that exists upstream:
          # `locationOf` shipped in 0.4.0 while this pinned ^0.2.0, and the scan
          # reported an unsafe call rather than a stale dependency.
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('chartdown/packages/core/package.json', 'utf8').replace(/^\uFEFF/, '')).version;
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8').replace(/^\uFEFF/, ''));
            for (const k of Object.keys(pkg.devDependencies)) if (k.startsWith('@chartdown/')) pkg.devDependencies[k] = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('pinned @chartdown/* to ' + v);
          "
          # …and the LOCKFILE has to follow the pins, or the two disagree and
          # `npm ci` refuses outright: "lock file's @chartdown/core@0.4.0 does
          # not satisfy @chartdown/core@0.5.0". The store scan installs before
          # it lints, so a stale lockfile does not merely mis-resolve a type —
          # nothing installs, every @chartdown import becomes `any`, and the
          # scan reports hundreds of no-unsafe-* warnings across every file
          # plus an out-of-date-lockfile error. That is what 0.3.0 hit, and it
          # was created by the pin rewrite immediately above: 0.2.1 taught us
          # to move the pins, and moving them without the lockfile is the same
          # drift wearing the other shoe.
          #
          # --package-lock-only: nothing here needs node_modules, and a full
          # install would fetch a tree the release does not use.
          npm install --package-lock-only --ignore-scripts
          node -e "
            const fs = require('fs');
            // BOM-tolerant: Windows tooling occasionally writes one.
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8').replace(/^﻿/, ''));
            const versions = fs.existsSync('versions.json') ? JSON.parse(fs.readFileSync('versions.json', 'utf8')) : {};
            versions[m.version] = m.minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Release ${{ steps.version.outputs.version }}"
          git push
      # THE RELEASED ARTIFACT IS BUILT FROM THIS REPOSITORY (Chartdown#265).
      # It used to be the monorepo's bundle, which resolves @chartdown/* to the
      # WORKSPACE SOURCE — packages/core/src/lex.ts and friends, module by
      # module — while this repository's pins and lockfile resolve them to the
      # published package's single dist/index.js. Same logic, different module
      # granularity, so the two never matched byte for byte and the store's
      # scan reported the asset as not reproducible from its own source.
      #
      # Building here makes the scan's rebuild the thing that shipped. It also
      # means the plugin bundles the PUBLISHED renderer rather than whatever
      # the monorepo ref happens to hold, so a renderer fix reaches the plugin
      # only once it is on npm — which is what the pins in package.json have
      # been claiming all along.
      - name: Build the plugin from THIS repository's synced source
        run: |
          npm ci
          npm run build
      - name: Attest build provenance for the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Release notes from this version's own changelog section
        run: |
          V="${{ steps.version.outputs.version }}"
          # THIS version's section, not the whole file: the community store
          # shows these notes verbatim, and a reader opening a release wants to
          # know what changed in it.
          awk -v v="## [$V]" 'index($0,v)==1{f=1;print;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $V — a release whose notes say nothing is how users find out their maps changed by noticing" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo "Built from Nossimonov/Chartdown@${{ inputs.ref }}."
          } >> notes.md
          cat notes.md
      - name: Create the release (tag = exact version, per Obsidian guidelines)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "$V" \
            main.js \
            manifest.json \
            styles.css \
            --title "$V" \
            --notes-file notes.md
